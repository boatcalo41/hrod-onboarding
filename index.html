<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<title>HROD · Onboarding & Offboarding</title>

<!-- PWA: installable to the home screen, runs full-screen like a native app -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c0272d">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HROD">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1b1f24; --sub:#6b7280;
    --line:#e5e7eb;
    --brand:#c0272d; --brand-dark:#8f1c21; --brand-ink:#ffffff;
    --brand-light:#fbe9e9; --brand-green:#3f9142; --brand-green-light:#e8f5e9;
    --charcoal:#3f3f3f;
    --accent:#2563eb; --warn:#b45309; --bad:#b91c1c; --good:#2f7d35;
    --chip:#f3f0ee;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:"Sarabun","Noto Sans Thai","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);animation:fadeIn .35s ease;
    -webkit-text-size-adjust:100%;overscroll-behavior-y:none;}
  /* Full-screen "native app" feel when installed/standalone, and on mobile browsers
     in general: avoid the address bar causing 100vh to be taller than the visible
     viewport, and respect the iPhone notch / home-indicator safe areas. */
  @supports (height:100dvh){ html,body{height:100dvh;} }
  .hamburger-btn{display:none;}
  .notif-bell-btn{position:relative;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .notif-bell-btn:hover{background:var(--chip);}
  .notif-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--brand-dark);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .notif-badge.overdue{background:var(--bad);}
  .notif-backdrop{position:fixed;inset:0;z-index:95;background:transparent;}
  .notif-panel{position:absolute;top:46px;right:0;z-index:96;width:320px;max-width:84vw;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.16);overflow:hidden;animation:panelIn .15s ease;}
  .notif-panel-head{padding:10px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);background:#fbfbfc;}
  .notif-panel-list{max-height:320px;overflow-y:auto;}
  .notif-item{padding:10px 14px;font-size:12.5px;line-height:1.5;border-top:1px solid #f1f2f4;cursor:pointer;}
  .notif-item:first-child{border-top:none;}
  .notif-item:hover{background:var(--chip);}
  .notif-item.notif-overdue{border-left:3px solid var(--bad);}
  .notif-item.notif-soon{border-left:3px solid var(--warn);}
  .notif-panel-empty{padding:18px 14px;font-size:12.5px;color:var(--sub);text-align:center;}
  .sidebar-close-btn{display:none;background:none;border:none;font-size:18px;line-height:1;color:var(--sub);cursor:pointer;padding:6px;flex:0 0 auto;}
  .sidebar-backdrop{display:none;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes panelIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes stampPop{from{opacity:0;transform:scale(.6) rotate(-14deg);}to{opacity:1;transform:scale(1) rotate(-8deg);}}
  .content{animation:panelIn .28s ease;}
  .tab-panel{animation:panelIn .28s ease;}
  .emp-item{transition:background-color .15s ease, border-color .15s ease, transform .15s ease;}
  .emp-item:active{transform:scale(.99);}
  .btn{transition:background-color .15s ease, transform .1s ease, box-shadow .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{box-shadow:0 1px 2px rgba(192,39,45,.25);}
  .tab{transition:color .15s ease, border-color .2s ease;}
  .progress-fill{transition:width .5s ease;}
  .nav-link{transition:background-color .15s ease, color .15s ease;}
  .policy-card,.biz-card,.card{transition:box-shadow .2s ease, transform .15s ease;}
  .biz-card:hover,.policy-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.06);transform:translateY(-1px);}
  .app{display:flex;min-height:100vh;}
  @supports (height:100dvh){ .app{min-height:100dvh;} }
  .sidebar{width:280px;flex:0 0 280px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;}
  .sidebar-head{padding:18px 16px 12px;border-bottom:1px solid var(--line);}
  .brand{font-weight:700;font-size:18px;letter-spacing:.3px;color:var(--brand);display:flex;align-items:center;gap:10px;}
  .brand img{height:34px;width:auto;display:block;}
  .brand .brand-text small{display:block;font-weight:400;font-size:11px;color:var(--sub);margin-top:1px;letter-spacing:0;}
  .role-box{margin:12px 16px;padding:10px;background:var(--chip);border-radius:10px;}
  .role-box label{font-size:11px;color:var(--sub);display:block;margin-bottom:4px;}
  select, input, textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);width:100%;}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;}
  .emp-search{margin:0 16px 8px;}
  .emp-list{flex:1;overflow-y:auto;padding:4px 10px 12px;}
  .emp-item{padding:10px 10px;border-radius:10px;cursor:pointer;margin-bottom:4px;border:1px solid transparent;}
  .emp-item:hover{background:var(--chip);}
  .emp-item.active{background:var(--brand-light);border-color:var(--brand);}
  .emp-name{font-weight:600;font-size:14px;}
  .emp-meta{font-size:12px;color:var(--sub);margin-top:2px;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;margin-top:5px;}
  .badge-onboarding{background:#fef3c7;color:#92400e;}
  .badge-active{background:#dcfce7;color:#166534;}
  .badge-offboarding{background:#fee2e2;color:#991b1b;}
  .badge-terminated{background:#e5e7eb;color:#374151;}
  .sidebar-foot{padding:12px 16px;border-top:1px solid var(--line);}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;}
  .btn:hover{background:var(--chip);}
  .btn-primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-danger{background:#fff;color:var(--bad);border-color:#fecaca;}
  .btn-danger:hover{background:#fef2f2;}
  .btn-block{width:100%;justify-content:center;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{padding:16px 28px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .topbar h1{font-size:18px;margin:0;}
  .topbar .sub{font-size:13px;color:var(--sub);margin-top:2px;}
  .content{flex:1;padding:24px 28px;overflow-y:auto;}
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .stat-card{position:relative;padding-left:20px;overflow:hidden;}
  .stat-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--stat-c,var(--brand));}
  .stat-icon{font-size:18px;margin-bottom:6px;display:block;}
  .stat-num{font-size:26px;font-weight:700;}
  .stat-label{font-size:12px;color:var(--sub);margin-top:4px;}
  .dash-row{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:22px;}
  @media (max-width:900px){.dash-row{grid-template-columns:1fr;}}
  .bar-item{margin-bottom:12px;}
  .bar-item:last-child{margin-bottom:0;}
  .bar-item .bar-head{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .bar-item .bar-head b{font-weight:700;}
  .bar-track{height:9px;background:var(--chip);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;transition:width .6s ease;}
  .ring-wrap{display:flex;align-items:center;gap:18px;}
  .ring{width:96px;height:96px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;position:relative;transition:background .5s ease;}
  .ring::after{content:"";position:absolute;inset:9px;background:var(--panel);border-radius:50%;}
  .ring-num{position:relative;z-index:1;font-size:19px;font-weight:800;color:var(--brand-dark);}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
  .tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--brand);border-color:var(--brand);}
  .tab:hover{color:var(--ink);}
  .section-title{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
  .section-title .count{font-size:12px;font-weight:500;color:var(--sub);}
  .phase-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;}
  .phase-head{padding:12px 16px;background:#fbfbfc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .phase-head .ph-title{font-weight:700;font-size:14px;}
  .phase-head .ph-sub{font-size:12px;color:var(--sub);}
  .progress-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;width:120px;}
  .progress-fill{height:100%;background:var(--brand);}
  .item-row{display:grid;grid-template-columns:34px 1fr 150px 170px 32px;gap:10px;align-items:start;padding:10px 16px;border-top:1px solid #f1f2f4;}
  .item-row:first-of-type{border-top:none;}
  .item-row label.chk{display:flex;align-items:center;justify-content:center;}
  .item-row input[type=checkbox]{width:18px;height:18px;cursor:pointer;}
  .item-label{font-size:13.5px;line-height:1.5;padding-top:2px;}
  .item-note{font-size:12.5px;}
  .item-date{font-size:12.5px;}
  .del-btn{background:none;border:none;color:var(--sub);cursor:pointer;font-size:16px;padding:2px;}
  .del-btn:hover{color:var(--bad);}
  .add-item-row{display:flex;gap:8px;padding:10px 16px;background:#fafafa;}
  .add-item-row input{flex:1;}
  .reflect-round{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
  .reflect-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
  .reflect-head h3{margin:0;font-size:14.5px;}
  .resp-block{margin-top:10px;}
  .resp-block > .resp-title{font-size:12.5px;font-weight:700;color:var(--brand);text-decoration:underline;margin-bottom:8px;}
  .q-row{display:grid;grid-template-columns:1fr 240px;gap:14px;padding:9px 0;border-top:1px solid #f1f2f4;align-items:start;}
  .q-row:first-child{border-top:none;}
  .q-text{font-size:13px;line-height:1.5;}
  .q-ans{display:flex;flex-direction:column;gap:6px;}
  .seg{display:flex;gap:4px;}
  .seg button{flex:1;font-size:11.5px;padding:5px 2px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--sub);}
  .seg button.sel-yes.on{background:#dcfce7;color:#166534;border-color:#86efac;}
  .seg button.sel-part.on{background:#fef3c7;color:#92400e;border-color:#fcd34d;}
  .seg button.sel-no.on{background:#fee2e2;color:#991b1b;border-color:#fca5a5;}
  .note-mini{font-size:12px;width:100%;}
  .free-text{width:100%;min-height:64px;resize:vertical;font-size:13px;}
  .field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:12px;color:var(--sub);font-weight:600;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--sub);}
  .empty-state .big{font-size:40px;margin-bottom:10px;}
  .pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--sub);font-weight:600;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px;}
  .modal h2{margin:0 0 4px;font-size:17px;}
  .modal .sub{font-size:12.5px;color:var(--sub);margin-bottom:16px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:calc(20px + env(safe-area-inset-right));background:#1b1f24;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .cat-title{font-size:12.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin:18px 0 6px 2px;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}
  .lock-note{font-size:12px;color:var(--sub);background:var(--chip);border-radius:8px;padding:8px 12px;margin-bottom:12px;}
  .scrollx{overflow-x:auto;}
  .passport-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 28px rgba(63,16,18,.12);position:relative;}
  .passport-header{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;padding:28px 30px 24px;}
  .passport-header::before{content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 88% -10%, rgba(255,255,255,.15) 0, transparent 45%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 10px, transparent 10px 20px);
    pointer-events:none;}
  .passport-header .pp-brand{position:relative;font-size:20px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:12px;}
  .passport-header .pp-brand img{height:42px;width:auto;background:#fff;border-radius:8px;padding:4px 8px;box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .passport-header .pp-brand small{display:block;font-weight:400;font-size:12px;opacity:.85;margin-top:2px;letter-spacing:0;}
  .passport-header .pp-title{position:relative;margin-top:16px;font-size:23px;font-weight:800;letter-spacing:.4px;}
  .passport-header .pp-sub{position:relative;font-size:13px;opacity:.92;margin-top:2px;letter-spacing:.3px;}
  .passport-body{padding:26px 30px;position:relative;}
  .passport-body::before{content:"ALLIED-TEK";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:92px;font-weight:800;color:var(--brand);opacity:.025;letter-spacing:4px;transform:rotate(-18deg);
    pointer-events:none;white-space:nowrap;z-index:0;}
  .passport-body > *{position:relative;z-index:1;}
  .pp-table{width:100%;border-collapse:collapse;margin-bottom:20px;border-radius:8px;overflow:hidden;}
  .pp-table td{border:1px solid var(--line);padding:9px 12px;font-size:13.5px;vertical-align:top;}
  .pp-table td.pp-label{background:var(--brand-light);font-weight:700;width:190px;color:var(--brand-dark);}
  .pp-section-h{font-size:14px;font-weight:800;color:var(--brand);margin:22px 0 10px;border-bottom:2px solid var(--brand);padding-bottom:6px;letter-spacing:.2px;}
  .pp-conn-table{width:100%;border-collapse:collapse;margin-bottom:18px;border-radius:8px;overflow:hidden;}
  .pp-conn-table th{background:var(--brand);color:#fff;font-size:12px;padding:8px 10px;text-align:left;}
  .pp-conn-table td{border:1px solid var(--line);padding:9px 10px;font-size:13px;}
  .pp-stamps{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
  .pp-stamp{width:130px;text-align:center;padding:14px 8px;border:2px dashed var(--line);border-radius:12px;font-size:12px;color:var(--sub);transition:transform .15s ease;}
  .pp-stamp.done{border:2px solid var(--brand-green);color:var(--brand-green);background:var(--brand-green-light);font-weight:700;transform:rotate(-2deg);box-shadow:0 2px 6px rgba(63,145,66,.18);animation:stampPop2 .3s ease;}
  @keyframes stampPop2{from{opacity:0;transform:scale(.7) rotate(-10deg);}to{opacity:1;transform:scale(1) rotate(-2deg);}}
  .pp-stamp .pp-stamp-icon{font-size:26px;display:block;margin-bottom:4px;}
  .pp-sign-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:26px;}
  .pp-sign-box{border-top:1px dashed var(--sub);padding-top:8px;font-size:12px;color:var(--sub);text-align:center;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;}
  .pp-sign-done .pp-sign-name{font-family:"Caveat","Segoe Script",cursive;font-size:25px;color:var(--brand-dark);line-height:1;}
  .pp-sign-done .pp-sign-meta{font-size:11px;color:var(--good);font-weight:700;}
  .pp-sign-form{display:flex;flex-direction:column;gap:6px;width:100%;max-width:200px;}
  .pp-sign-form input{font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;text-align:center;}
  .pp-sign-form button{font-size:11.5px;padding:5px 0;border-radius:7px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;}
  .pp-sign-form button:hover{background:var(--brand-dark);}
  .pp-sign-label{font-weight:700;color:var(--charcoal);}
  .pp-print-btn{margin-bottom:14px;}
  @media print{ .sidebar,.topbar,.tabs,.pp-print-btn,.pp-sign-form,.pp-sign-done button{display:none !important;} .content{padding:0 !important;} }
  .nav-link{display:block;margin:0 16px 10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-light);cursor:pointer;border:1px solid transparent;}
  .nav-link:hover{border-color:var(--brand);}
  .nav-link.active{background:var(--brand);color:#fff;}
  .policy-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px;}
  .policy-card h3{margin:0;padding:12px 16px;font-size:14px;background:#fbfbfc;border-bottom:1px solid var(--line);}
  .policy-card img{display:block;width:100%;height:auto;}
  .biz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0 20px;}
  .biz-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;}
  .biz-card b{color:var(--brand);display:block;margin-bottom:4px;font-size:13.5px;}
  .biz-card span{font-size:12.5px;color:var(--sub);}
  .orient-card{margin-bottom:18px;}
  .orient-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;}
  .orient-label{font-size:12px;color:var(--sub);margin-bottom:4px;}
  .orient-val{font-size:15px;font-weight:700;color:var(--ink);}
  .exam-option-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;cursor:pointer;font-size:14px;max-width:560px;}
  .exam-option-row input{flex:none;width:16px;height:16px;margin-top:3px;}
  .exam-option-row span{flex:1;}
  .exam-textarea{width:100%;max-width:520px;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:14px;}
  .kpi-table{width:100%;border-collapse:collapse;margin-top:10px;}
  .kpi-table th{background:var(--brand);color:#fff;font-size:12px;padding:8px 10px;text-align:left;}
  .kpi-table td{border:1px solid var(--line);padding:9px 10px;font-size:12.5px;vertical-align:top;}

  /* ---------- LOGIN PAGE ---------- */
  .login-screen{min-height:100vh;width:100%;display:flex;flex-wrap:wrap;background:#faf7f6;animation:fadeIn .35s ease;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
  @supports (height:100dvh){ .login-screen{min-height:100dvh;} }
  .login-brand{flex:1 1 480px;min-width:320px;min-height:420px;position:relative;overflow:hidden;
    background:linear-gradient(145deg,var(--brand) 0%,var(--brand-dark) 100%);
    display:flex;flex-direction:column;justify-content:space-between;padding:56px;box-sizing:border-box;color:#fff;}
  .login-brand::before{content:"ALLIED-TEK";position:absolute;inset:0;opacity:.07;display:flex;align-items:center;
    justify-content:center;transform:rotate(-16deg);font-size:160px;font-weight:800;letter-spacing:6px;white-space:nowrap;pointer-events:none;}

/* ============== HELPERS ============== */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return "–"; try{ const d=new Date(s); return d.toLocaleDateString("th-TH",{year:"numeric",month:"short",day:"numeric"}); }catch(e){return s;} }
function addDays(dateStr, days){ const d=new Date(dateStr); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function el(tag, attrs={}, children=[]){
  const e=document.createElement(tag);
  for(const k in attrs){
    const v = attrs[k];
    if(v===null || v===undefined || v===false) continue;
    if(k==="class") e.className=v;
    else if(k==="html") e.innerHTML=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(k==="checked" || k==="disabled" || k==="selected") e.setAttribute(k, k);
    else e.setAttribute(k, v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    if(typeof c==="string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

function phaseProgress(items){
  if(!items || !items.length) return 0;
  const done = items.filter(i=>i.status==="done").length;
  return Math.round(done/items.length*100);
}
function employeeOverallStatusLabel(emp){
  if(emp.status==="terminated") return {label:"ออกจากงานแล้ว", cls:"badge-terminated"};
  if(emp.status==="offboarding") return {label:"กำลัง Offboard", cls:"badge-offboarding"};
  const phases=["phase1","phase2","phase3","phase4"];
  const allItems = phases.flatMap(p=> (emp.onboarding && emp.onboarding[p]) || []);
  const prog = phaseProgress(allItems);
  if(prog>=100) return {label:"Onboarding เสร็จสมบูรณ์", cls:"badge-active"};
  return {label:"กำลัง Onboard", cls:"badge-onboarding"};
}

function quizGradedQuestions(def){ return def.questions.filter(q=>!q.ungraded); }
function quizAutoMaxPoints(def){ return def.questions.filter(q=>q.type!=="text" && !q.ungraded).length; }
function scoreQuizAnswers(def, answers){
  let auto = 0, autoMax = 0, manualPending = 0;
  def.questions.forEach(q=>{
    if(q.ungraded) return;
    if(q.type==="text"){ manualPending++; return; }
    autoMax++;
    if(answers[q.id]===q.correct) auto++;
  });
  return { auto, autoMax, manualPending };
}
function probationDueDate(emp){
  return emp.startDate ? addDays(emp.startDate, 105) : null;
}
function getExamResult(emp, roundKey){
  return (emp.exams && emp.exams[roundKey]) || null;
}

/* ---------- Notifications (in-app only — no server to push from, so this is
   computed fresh from state.employees on every render) ----------
   Surfaces three kinds of "มีอะไรค้างอยู่" items for HR / Supervisor:
     - the probation/round-2 evaluation date approaching or passed with the
       pre-probation exam still not taken
     - written exam answers waiting on a manual HR review
     - OJT topics whose "กำหนดสอนจบ" date is approaching or passed and not
       marked done yet
   Each item carries severity ("overdue" | "soon") and the employee id, so
   the notification list can jump straight to that person. */
const REFLECT_DUE_DAYS = { r1: 7, r2: 30, r3: 45 };
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  if(isNaN(d.getTime())) return null;
  return Math.round((d-today)/86400000);
}
function employeeNotifications(emp, id){
  const out = [];
  if(emp.status==="terminated") return out;
  const name = emp.name || "(ไม่มีชื่อ)";

  const due = probationDueDate(emp);
  if(due){
    const dleft = daysUntil(due);
    const r2 = getExamResult(emp, "round2");
    if(!r2 && dleft!==null){
      if(dleft<0) out.push({id, severity:"overdue", text:`${name}: เลยกำหนดครบทดลองงานแล้ว (${fmtDate(due)}) — ยังไม่ได้ทำข้อสอบก่อนผ่านทดลองงาน`});
      else if(dleft<=7) out.push({id, severity:"soon", text:`${name}: ใกล้ครบทดลองงานใน ${dleft} วัน (${fmtDate(due)}) — ยังไม่ได้ทำข้อสอบก่อนผ่านทดลองงาน`});
    }
  }

  ["round1","round2"].forEach(rk=>{
    const r = getExamResult(emp, rk);
    if(r && r.manualPending) out.push({id, severity:"soon", text:`${name}: มีคำตอบ${QUIZ_ROUNDS[rk].label} รอ HR ตรวจ ${r.manualPending} ข้อ`});
  });

  (emp.ojt||[]).forEach(o=>{
    if(o.status==="done" || !o.dueDate) return;
    const dleft = daysUntil(o.dueDate);
    if(dleft===null) return;
    if(dleft<0) out.push({id, severity:"overdue", text:`${name}: เลยกำหนดสอนจบหัวข้อ OJT "${o.topic}" แล้ว (${fmtDate(o.dueDate)})`});
    else if(dleft<=3) out.push({id, severity:"soon", text:`${name}: ใกล้ถึงกำหนดสอนจบหัวข้อ OJT "${o.topic}" ใน ${dleft} วัน`});
  });

  if(emp.startDate){
    Object.entries(REFLECT_DUE_DAYS).forEach(([key,dayNum])=>{
      const target = addDays(emp.startDate, dayNum);
      const dleft = daysUntil(target);
      if(dleft===null) return;
      const doneFlag = ((emp.reflections && emp.reflections[key] && emp.reflections[key].employeeOpen)||"").trim().length>0;
      if(doneFlag) return;
      if(dleft<0 && dleft>=-14) out.push({id, severity:"overdue", text:`${name}: เลยวันแบบสะท้อน 2/3 ทางรอบ ${dayNum} วันแล้ว (${fmtDate(target)})`});
      else if(dleft>=0 && dleft<=3) out.push({id, severity:"soon", text:`${name}: ถึงกำหนดแบบสะท้อน 2/3 ทางรอบ ${dayNum} วัน ใน ${dleft} วัน`});
    });
  }
  return out;
}
function collectNotifications(employeeList){
  const items = employeeList.flatMap(e=> employeeNotifications(e, e.id));
  items.sort((a,b)=> (a.severity==="overdue"?0:1) - (b.severity==="overdue"?0:1));
  return items;
}

function notifBell(employeeList, onJump){

async function submitQuizRound(id, roundKey, answers){
  const def = QUIZ_ROUNDS[roundKey];
  const scored = scoreQuizAnswers(def, answers);
  const emp = state.employees[id];
  const exams = {...(emp.exams||{})};
  exams[roundKey] = {
    answers,
    auto: scored.auto,
    autoMax: scored.autoMax,
    manualPending: scored.manualPending,
    submittedAt: new Date().toISOString(),
  };
  await saveEmployee(id, {exams});
}
function renderOrientationCard(emp){

  const rows = Object.values(QUIZ_ROUNDS).map(def=>{
    const res = getExamResult(emp, def.key);

    return el("div",{class:"orient-item"},[

      res
        ? el("div",{},[

              " ",
              el("span",{class:"badge "+(pass?"badge-active":"badge-offboarding")}, pass? "ผ่านเกณฑ์ 80%" : "ยังไม่ผ่านเกณฑ์ 80%")
            ]),
            el("div",{style:"font-size:11.5px;color:var(--sub);margin-top:2px;"},
              fmtDate(res.submittedAt) + (res.manualPending? ` · รอ HR ตรวจคำตอบเขียน ${res.manualPending} ข้อ` : ""))

function startExamRound(roundKey){
  state.examActiveRound = roundKey;
  state.examDraft = {};

}
function exitExamRound(){
  state.examActiveRound = null;
  state.examDraft = {};

}
async function finishExamRound(id, roundKey){
  const def = QUIZ_ROUNDS[roundKey];
  const unanswered = def.questions.filter(q=> {
    const v = state.examDraft[q.id];
    return v===undefined || v===null || v==="";
  });
  if(unanswered.length){
    alert(`กรุณาตอบให้ครบทุกข้อ (เหลืออีก ${unanswered.length} ข้อ)`);
    return;
  }
  await submitQuizRound(id, roundKey, state.examDraft);
  state.examActiveRound = null;
  state.examDraft = {};
  render();
}

/* ============== DATA LAYER (Google Sheets via Apps Script Web App) ==============
   Storage model: the whole app reads/writes one "employees" list through a
   Google Apps Script Web App that you deploy yourself (see README.md).
   The script keeps the data in a Google Sheet in your own Google Drive.
   This page has no server of its own — it just calls that URL with fetch(),
   and polls every POLL_MS to approximate realtime (Apps Script / Sheets
   have no push-realtime channel like Firestore does). */
const API_URL_KEY = "HROD_API_URL";
const SESSION_KEY = "HROD_SESSION";
// Keeps the logged-in session across an accidental page reload (e.g. the
// browser reloading a background tab, or a new deploy forcing a refresh) —
// without this, any reload drops the user straight back to the login screen
// even though nothing about "being logged in" actually changed.
function saveSession(){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({ role: state.role, selectedId: state.selectedId }));
  }catch(e){ /* storage unavailable — session just won't survive a reload */ }
}
function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
const POLL_MS = 4000;
let pollTimer = null;

function getApiUrl(){ return (localStorage.getItem(API_URL_KEY) || "").trim(); }
function setApiUrl(url){ localStorage.setItem(API_URL_KEY, url.trim()); }

async function apiList(){
  const url = getApiUrl();
  if(!url) throw new Error("no-api-url");
  const res = await fetch(url + (url.includes("?")?"&":"?") + "action=list", { method:"GET" });
  if(!res.ok) throw new Error("http " + res.status);
  const body = await res.json();
  if(!body.ok) throw new Error(body.error || "api error");
  return { employees: body.employees || [], config: body.config || {}, orientation: body.orientation || {}, jobDescriptions: body.jobDescriptions || [] };
}

async function apiSetConfig(key, data){
  const url = getApiUrl();
  if(!url) throw new Error("no-api-url");
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "setConfig", key, data })
  });
  const body = await res.json();
  if(!body.ok) throw new Error(body.error || "api error");
}

async function apiSet(id, data){
  const url = getApiUrl();
  if(!url) throw new Error("no-api-url");
  // text/plain avoids a CORS preflight that Apps Script web apps can't answer;
  // the script still parses the body as JSON (see apps-script/Code.gs).
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "set", id, data })
  });
  const body = await res.json();
  if(!body.ok) throw new Error(body.error || "api error");
}

  const url = getApiUrl();

    body: JSON.stringify({ action: "delete", id })

}

// Asks the backend to render the current draft as a PDF matching the
// original F-PM-25 layout and file it into Google Drive under ฝ่าย/แผนก.
// Returns { pdfUrl, pdfFileId, pdfUpdatedAt } — the caller merges that into
// the record (the backend also persists the merged record itself).
async function apiGenerateJdPdf(id, data){
  const url = getApiUrl();
  if(!url) throw new Error("no-api-url");
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "generateJdPdf", id, data })
  });
  const body = await res.json();
  if(!body.ok) throw new Error(body.error || "api error");
  return { pdfUrl: body.pdfUrl, pdfFileId: body.pdfFileId, pdfUpdatedAt: body.pdfUpdatedAt };
}

/* ============== POLLING ============== */
function startPolling(){
  state.apiConfigured = !!getApiUrl();
  if(!state.apiConfigured){
    state.loading = false;
    render();
    return;
  }
  refreshEmployees();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshEmployees, POLL_MS);
}

async function refreshEmployees(){
  try{
    const { employees: list, config, orientation, jobDescriptions } = await apiList();
    const next = {};
    list.forEach(row=>{ next[row.id] = row.data; });
    const nextJd = {};
    (jobDescriptions||[]).forEach(row=>{ nextJd[row.id] = row.data; });
    const changed = JSON.stringify(next) !== JSON.stringify(state.employees)
      || JSON.stringify(config) !== JSON.stringify(state.config)
      || JSON.stringify(orientation) !== JSON.stringify(state.orientationResults)
      || JSON.stringify(nextJd) !== JSON.stringify(state.jobDescriptions);
    state.employees = next;
    state.config = config || {};
    state.orientationResults = orientation || {};
    state.jobDescriptions = nextJd;
    if(!state.selectedId){
      const ids = Object.keys(state.employees);
      if(ids.length) state.selectedId = ids[0];
    }
    const wasLoading = state.loading, wasReady = state.dbReady, hadErr = state.apiError;
    state.loading = false;
    state.dbReady = true;
    state.apiError = "";
    // Skip re-rendering (and re-playing entrance animations) when nothing actually
    // changed — avoids a visible flicker every poll cycle (~4s).
    if(changed || wasLoading || !wasReady || hadErr) render();
  }catch(e){
    state.loading = false;
    state.dbReady = false;
    state.apiError = String(e.message || e);
    console.error("refreshEmployees failed", e);
    render();
  }
}

// Optimistically updates state.config and persists it to the "config" sheet.
// Used by the HR Admin Portal (Journey Template / Learning Management /
// Assessment Management / User & Role Management) to edit shared, app-wide
// settings that affect every user, not just one employee record.
async function saveConfig(key, data){
  state.config = { ...state.config, [key]: data };
  render();
  try{ await apiSetConfig(key, data); }
  catch(e){ toast("บันทึกการตั้งค่าไม่สำเร็จ: " + (e.message||e)); console.error(e); }
}

async function saveEmployee(id, patch){
  const merged = {...(state.employees[id]||{}), ...patch};
  state.employees[id] = merged; // optimistic local update
  render();

    await apiSet(id, merged);
  }catch(e){
    toast("บันทึกไม่สำเร็จ: " + (e.message||e));
    console.error(e);
  }
}

async function generateJdPdf(id){
  const data = state.jobDescriptions[id];
  if(!data) return;
  if(!data.title || !data.division || !data.department){
    toast("กรุณากรอก ฝ่าย / แผนก / ตำแหน่งงาน ก่อนสร้าง PDF");
    return;
  }
  state.jdGenerating = true;
  render();
  try{
    const { pdfUrl, pdfFileId, pdfUpdatedAt } = await apiGenerateJdPdf(id, data);
    state.jobDescriptions[id] = { ...data, pdfUrl, pdfFileId, pdfUpdatedAt };
    toast("สร้าง PDF และบันทึกลง Google Drive แล้ว");
  }catch(e){
    toast("สร้าง PDF ไม่สำเร็จ: " + (e.message||e));
    console.error(e);
  }finally{
    state.jdGenerating = false;
    render();
  }
}

/* ---------- LOGIN ---------- */
function attemptEmployeeLogin(){
  const code = (state.loginCode||"").trim();
  if(!code){ state.loginError="กรุณากรอกรหัสพนักงาน"; render(); return; }
  const match = Object.entries(state.employees).find(([,e])=> (e.code||"").trim().toLowerCase()===code.toLowerCase());
  if(!match){ state.loginError="ไม่พบรหัสพนักงานนี้ในระบบ กรุณาตรวจสอบอีกครั้ง"; render(); return; }
  state.authed = true;
  state.loginError = "";
  state.role = "employee";
  state.selectedId = match[0];
  state.portalTab = "dashboard";
  saveSession();
  render();
}
// HR/Manager login — a single shared password per role (not per-person).
// HR sets/changes these from User & Role Management; until HR sets one,
// these defaults apply so the roles are still reachable on a fresh setup.
const DEFAULT_ROLE_PASSWORD = { hr: "HR1234", manager: "MGR1234" };
function getRolePassword(role){
  return (state.config && state.config[role + "Password"]) || DEFAULT_ROLE_PASSWORD[role];
}
function openRoleLoginPrompt(role){
  state.loginRoleAttempt = role;
  state.loginRolePassword = "";
  state.loginRoleError = "";
  render();
}
function cancelRoleLoginPrompt(){
  state.loginRoleAttempt = null;
  state.loginRolePassword = "";
  state.loginRoleError = "";
  render();
}
function attemptRoleLogin(role){
  const pw = (state.loginRolePassword||"").trim();
  if(!pw){ state.loginRoleError = "กรุณากรอกรหัสผ่าน"; render(); return; }
  if(pw !== getRolePassword(role)){ state.loginRoleError = "รหัสผ่านไม่ถูกต้อง"; render(); return; }
  state.authed = true;
  state.loginError = "";
  state.role = role;
  state.loginRoleAttempt = null;
  state.loginRolePassword = "";
  state.loginRoleError = "";
  saveSession();
  render();
}
function logout(){
  state.authed = false;
  state.loginCode = "";

function getSupervisorNames(){
  const names = new Set();
  getConfiguredSupervisorNames().forEach(n=> n && names.add(n));
  Object.values(state.employees).forEach(e=>{
    if(e.manager) names.add(e.manager);
    if(e.buddy) names.add(e.buddy);
  });
  return Array.from(names).sort((a,b)=>a.localeCompare(b,"th"));

  return Object.entries(state.employees)

    .sort((a,b)=> (a.name||"").localeCompare(b.name||"", "th"));

      wrap.appendChild(el("button",{class:"btn", onclick:()=>{ saveEmployee(state.selectedId,{status:"terminated"}); toast("ปิดสถานะพนักงานเรียบร้อย"); } }, "ปิดสถานะ (Terminated)"));
    }
    wrap.appendChild(el("button",{class:"btn btn-danger", onclick:()=>{ if(confirm("ยืนยันลบข้อมูลพนักงานนี้ทั้งหมด?")) deleteEmployee(state.selectedId); } }, "ลบ"));
  }
  return wrap;
}

function renderDashboard(){
  const emps = Object.values(state.employees);
  const counts = { onboarding:0, active:0, offboarding:0, terminated:0 };
  let progSum = 0, progN = 0;
  emps.forEach(e=>{
    const st = employeeOverallStatusLabel(e);
    if(e.status==="offboarding") counts.offboarding++;
    else if(e.status==="terminated") counts.terminated++;
    else if(st.label.includes("เสร็จ")) counts.active++;
    else counts.onboarding++;
    if(e.status!=="terminated"){
      const phases=["phase1","phase2","phase3","phase4"];
      const allItems = phases.flatMap(p=> (e.onboarding && e.onboarding[p]) || []);
      if(allItems.length){ progSum += phaseProgress(allItems); progN++; }
    }
  });
  const avgProg = progN ? Math.round(progSum/progN) : 0;

  const wrap = el("div",{});
  wrap.appendChild(el("div",{class:"dash-grid"},[
    statCard(emps.length, "พนักงานทั้งหมดในระบบ", "👥", "var(--charcoal)"),
    statCard(counts.onboarding, "กำลัง Onboard", "🚀", "var(--warn)"),
    statCard(counts.active, "ผ่านทดลองงานแล้ว", "✅", "var(--brand-green)"),
    statCard(counts.offboarding, "กำลัง Offboard", "📤", "var(--brand)"),
    statCard(counts.terminated, "ออกจากงานแล้ว", "🏁", "var(--sub)"),
  ]));

  if(emps.length){
    const barData = [
      ["กำลัง Onboard", counts.onboarding, "var(--warn)"],
      ["ผ่านทดลองงานแล้ว", counts.active, "var(--brand-green)"],
      ["กำลัง Offboard", counts.offboarding, "var(--brand)"],
      ["ออกจากงานแล้ว", counts.terminated, "var(--sub)"],
    ];
    const total = emps.length || 1;
    const ringPct = avgProg;
    const ringColor = ringPct>=100 ? "var(--brand-green)" : "var(--brand)";
    wrap.appendChild(el("div",{class:"dash-row"},[
      el("div",{class:"card"},[
        el("div",{class:"section-title",style:"margin-top:0;"},"สัดส่วนพนักงานตามสถานะ"),
        el("div",{}, barData.map(([label,n,color])=> el("div",{class:"bar-item"},[
          el("div",{class:"bar-head"},[ el("span",{},label), el("b",{}, String(n)+" คน") ]),
          el("div",{class:"bar-track"},[ el("div",{class:"bar-fill", style:`width:${Math.round(n/total*100)}%;background:${color};`}) ])
        ])))
      ]),
      el("div",{class:"card"},[
        el("div",{class:"section-title",style:"margin-top:0;"},"ความคืบหน้า Onboarding เฉลี่ย"),
        el("div",{class:"ring-wrap"},[
          el("div",{class:"ring", style:`background:conic-gradient(${ringColor} ${ringPct*3.6}deg, var(--chip) 0deg);`},[
            el("div",{class:"ring-num"}, ringPct+"%")
          ]),
          el("div",{style:"font-size:12.5px;color:var(--sub);line-height:1.6;"},
            progN ? `เฉลี่ยจากพนักงานที่กำลังอยู่ในระบบ ${progN} คน (ไม่รวมพนักงานที่ออกจากงานแล้ว)` : "ยังไม่มีข้อมูลความคืบหน้า Onboarding")
        ])
      ])
    ]));
  }

  if(!state.apiConfigured){
    wrap.appendChild(el("div",{class:"lock-note"}, "ยังไม่ได้ตั้งค่า Apps Script API URL — กด \"⚙️ ตั้งค่าฐานข้อมูล\" ที่แถบด้านซ้ายก่อน ไม่งั้นข้อมูลจะไม่ถูกบันทึกถาวร (ดูขั้นตอนใน README.md)"));
  } else if(!state.dbReady){
    wrap.appendChild(el("div",{class:"lock-note"}, "เชื่อมต่อฐานข้อมูลไม่สำเร็จ: " + (state.apiError||"ไม่ทราบสาเหตุ") + " — ตรวจสอบว่า deploy Apps Script เป็น \"Anyone\" แล้ว และ URL ถูกต้อง"));
  }
  if(!emps.length && !state.loading){
    wrap.appendChild(el("div",{class:"empty-state"},[
      el("div",{class:"big"}, "👋"),
      el("div",{}, "ยังไม่มีพนักงานในระบบ กด \"+ เพิ่มพนักงานใหม่\" ที่แถบด้านซ้ายเพื่อเริ่มต้น")
    ]));
  } else if(emps.length){
    wrap.appendChild(el("div",{class:"section-title"}, "เลือกพนักงานทางด้านซ้ายเพื่อดูรายละเอียด"));
  }
  return wrap;
}

function portalDaysSinceStart(emp){
  if(!emp.startDate) return null;
  const start = new Date(emp.startDate+"T00:00:00");
  const now = new Date();
  return Math.max(0, Math.floor((now-start)/86400000));
}

function portalOverallProgress(emp){
  const phases=["phase1","phase2","phase3","phase4"];
  const allItems = phases.flatMap(p=> (emp.onboarding && emp.onboarding[p]) || []);
  return phaseProgress(allItems);
}

function computeOnboardingStats(){
  const emps = Object.values(state.employees);
  const durations = [];
  const slaList = [];
  const SLA_DAYS = 120;
  let leftDuringOnboarding = 0;
  emps.forEach(e=>{
    const prog = portalOverallProgress(e);
    const days = portalDaysSinceStart(e);
    if((e.status==="terminated" || e.status==="offboarding") && prog<100) leftDuringOnboarding++;
    if(prog>=100 && e.startDate){
      const phases=["phase1","phase2","phase3","phase4"];
      let maxDate=null;
      phases.forEach(pk=> (e.onboarding&&e.onboarding[pk]||[]).forEach(it=>{
        if(it.status==="done" && it.date && (!maxDate || it.date>maxDate)) maxDate=it.date;
      }));
      if(maxDate){
        const dur = Math.round((new Date(maxDate+"T00:00:00") - new Date(e.startDate+"T00:00:00"))/86400000);
        if(dur>=0) durations.push(dur);
      }
    }
    if(prog<100 && days!=null && days>SLA_DAYS && e.status!=="terminated"){
      slaList.push({ name:e.name, position:e.position, department:e.department, days, prog });
    }
  });
  return {
    total: emps.length,
    avgDuration: durations.length ? Math.round(durations.reduce((a,b)=>a+b,0)/durations.length) : null,
    completedCount: durations.length,
    churnRate: emps.length ? Math.round(leftDuringOnboarding/emps.length*100) : 0,
    leftDuringOnboarding,
    slaList: slaList.sort((a,b)=>b.days-a.days),
  };
}

function downloadCsv(filename, rows){
  const csv = rows.map(r=> r.map(v=> '"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

const SIGN_BOXES = [
  {key:"employee", label:"พนักงาน", allowedRole:"employee"},
  {key:"buddy",    label:"พี่เลี้ยง", allowedRole:"manager"},
  {key:"manager",  label:"หัวหน้างาน", allowedRole:"manager"},
  {key:"hr",       label:"HR", allowedRole:"hr"},
];
async function signPassport(id, key, name){
  const emp = state.employees[id];
  const signatures = {...(emp.signatures||{})};
  signatures[key] = { name, signedAt: Date.now() };
  await saveEmployee(id, {signatures});
}
async function unsignPassport(id, key){
  const emp = state.employees[id];
  const signatures = {...(emp.signatures||{})};
  delete signatures[key];
  await saveEmployee(id, {signatures});
}
function renderSignBox(emp, id, box){
  const signatures = emp.signatures || {};
  const rec = signatures[box.key];
  const canSign = state.role === box.allowedRole;

  if(rec){
    const children = [
      el("div",{class:"pp-sign-label"}, box.label),
      el("div",{class:"pp-sign-name"}, rec.name),
      el("div",{class:"pp-sign-meta"}, "✅ ลงชื่อแล้ว · " + fmtDate(new Date(rec.signedAt).toISOString()))
    ];
    if(canSign){
      children.push(el("button",{
        type:"button",
        style:"background:none;border:none;color:var(--sub);font-size:10.5px;text-decoration:underline;cursor:pointer;padding:0;",
        onclick:()=>{ if(confirm("ยกเลิกลายเซ็นนี้?")) unsignPassport(id, box.key); }
      }, "ยกเลิกลายเซ็น"));
    }
    return el("div",{class:"pp-sign-box pp-sign-done"}, children);
  }

  if(!canSign){
    return el("div",{class:"pp-sign-box"},[
      el("div",{class:"pp-sign-label"}, box.label),
      el("div",{}, "ยังไม่ได้ลงชื่อ")
    ]);
  }

  let typed = "";
  const input = el("input",{type:"text", placeholder:"พิมพ์ชื่อ-นามสกุลเพื่อยืนยัน", oninput:(e)=> typed=e.target.value});
  return el("div",{class:"pp-sign-box"},[
    el("div",{class:"pp-sign-label"}, box.label),
    el("div",{class:"pp-sign-form"},[
      input,
      el("button",{type:"button", onclick:()=>{
        const name = typed.trim();
        if(!name){ toast("กรุณาพิมพ์ชื่อ-นามสกุลก่อนลงชื่อ"); return; }
        signPassport(id, box.key, name);
      }}, "✍️ ยืนยันลงชื่อ")
    ])
  ]);
}

    empBlock.appendChild(el("div",{class:"q-row"},[
      el("div",{class:"q-text"}, row.q),
      el("div",{class:"q-ans"},[ seg, el("input",{class:"note-mini", placeholder:"ขยายความ (ถ้ามี)", value:row.note||"", disabled: canEditEmployee?null:"disabled",
        onchange:(e)=>{ data.employee[idx]={...row, note:e.target.value}; onChange(); } }) ])
    ]));
  });
  empBlock.appendChild(el("div",{style:"margin-top:10px;"},[
    el("label",{style:"font-size:12px;color:var(--sub);font-weight:600;display:block;margin-bottom:4px;"}, round.openQ),
    el("textarea",{class:"free-text", value:data.employeeOpen||"", disabled: canEditEmployee?null:"disabled",
      onchange:(e)=>{ data.employeeOpen=e.target.value; onChange(); } })
  ]));
  card.appendChild(empBlock);

  // Buddy section
  const buddyBlock = el("div",{class:"resp-block"},[ el("div",{class:"resp-title"},"ส่วน ข · พี่เลี้ยงตอบ") ]);
  data.buddy.forEach((row, idx)=>{
    const seg = el("div",{class:"seg"},[
      ansButtonWrap("yes","ใช่",row.ans==="yes", ()=>{ if(!canEditBuddy)return; data.buddy[idx]={...row, ans:"yes"}; onChange(); }),
      ansButtonWrap("part","บางส่วน",row.ans==="part", ()=>{ if(!canEditBuddy)return; data.buddy[idx]={...row, ans:"part"}; onChange(); }),
      ansButtonWrap("no","ไม่ใช่",row.ans==="no", ()=>{ if(!canEditBuddy)return; data.buddy[idx]={...row, ans:"no"}; onChange(); }),
    ]);
    buddyBlock.appendChild(el("div",{class:"q-row"},[
      el("div",{class:"q-text"}, row.q),
      el("div",{class:"q-ans"},[ seg, el("input",{class:"note-mini", placeholder:"ขยายความ (ถ้ามี)", value:row.note||"", disabled: canEditBuddy?null:"disabled",
        onchange:(e)=>{ data.buddy[idx]={...row, note:e.target.value}; onChange(); } }) ])
    ]));
  });
  card.appendChild(buddyBlock);

  // HR section
  const hrBlock = el("div",{class:"resp-block"},[
    el("div",{class:"resp-title"},"ส่วน ค · HR บันทึก"),
    el("textarea",{class:"free-text", placeholder:"ข้อเสนอแนะ / แนวทางการแก้ไขปัญหาที่เกิดขึ้น", value:data.hrNotes||"", disabled: canEditHR?null:"disabled",
      onchange:(e)=>{ data.hrNotes=e.target.value; onChange(); } })
  ]);
  card.appendChild(hrBlock);

  return card;
}
function ansButtonWrap(kind, label, on, onClick){
  const cls = kind==="yes"?"sel-yes":kind==="part"?"sel-part":"sel-no";
  return el("button",{class:cls+(on?" on":""), onclick:onClick}, label);
}

function renderReflectTab(emp, id){
  const wrap = el("div",{});
  const refl = emp.reflections || makeEmptyReflections();
  const canEditEmployee = state.role==="employee";
  const canEditBuddy = state.role==="manager";
  const canEditHR = state.role==="hr";
  if(!canEditEmployee && !canEditBuddy && !canEditHR){} // no-op
  REFLECT_ROUNDS.forEach(round=>{
    const data = refl[round.key] || { employee: EMP_QUESTIONS.map(q=>({q,ans:"",note:""})), buddy: BUDDY_QUESTIONS.map(q=>({q,ans:"",note:""})), employeeOpen:"", hrNotes:"" };
    const onChange = ()=>{ const next={...refl,[round.key]:data}; saveEmployee(id,{reflections:next}); };
    wrap.appendChild(renderReflectRound(round, data, onChange, canEditEmployee, canEditBuddy, canEditHR));
  });
  return wrap;
}

/* ============== MODALS ============== */
function closeModal(){
  const b = document.querySelector(".modal-backdrop");
  if(b) b.remove();
}
function openModal(contentEl){
  closeModal();
  const backdrop = el("div",{class:"modal-backdrop", onclick:(e)=>{ if(e.target.classList.contains("modal-backdrop")) closeModal(); }});
  backdrop.appendChild(el("div",{class:"modal"}, contentEl));
  document.body.appendChild(backdrop);
}

function openAddEmployeeModal(){
  const form = {};
  const field = (label, key, type="text") => {
    const input = el("input",{type, oninput:(e)=> form[key]=e.target.value});
    return el("div",{class:"field"},[el("label",{},label), input]);
  };
  const body = el("div",{},[
    el("h2",{},"เพิ่มพนักงานใหม่"),
    el("div",{class:"sub"},"กรอกข้อมูลเบื้องต้น ระบบจะสร้าง Onboarding Checklist ให้อัตโนมัติ"),
    el("div",{class:"field-grid"},[
      field("ชื่อ-นามสกุล","name"),
      field("ชื่อเล่น","nickname"),
      field("รหัสพนักงาน","code"),
      field("ตำแหน่ง","position"),
      field("แผนก / ทีม","department"),
      field("วันเริ่มงาน","startDate","date"),
      field("หัวหน้างานโดยตรง","manager"),
      field("เบอร์/LINE หัวหน้า","managerPhone"),
      field("พี่เลี้ยง (Buddy)","buddy"),
      field("เบอร์/LINE พี่เลี้ยง","buddyPhone"),
      field("HR ผู้ดูแล","hrOfficer"),
      field("เบอร์/LINE HR","hrPhone"),
    ]),
    el("div",{class:"modal-foot"},[
      el("button",{class:"btn", onclick: closeModal}, "ยกเลิก"),
      el("button",{class:"btn btn-primary", onclick: async ()=>{
        if(!form.name){ toast("กรุณากรอกชื่อพนักงาน"); return; }
        await createEmployee(form);
        closeModal();
        render();
      }}, "บันทึก")
    ])
  ]);
  openModal(body);
}

function openOffboardModal(id){
  const emp = state.employees[id];
  let lastWorkDate = "", reason = "";
  const body = el("div",{},[
    el("h2",{},"เริ่มกระบวนการ Offboarding"),
    el("div",{class:"sub"}, `สำหรับ ${emp.name} — ระบบจะสร้าง Offboarding Checklist ให้อัตโนมัติ`),
    el("div",{class:"field-grid"},[
      el("div",{class:"field"},[el("label",{},"วันทำงานวันสุดท้าย"), el("input",{type:"date", oninput:(e)=>lastWorkDate=e.target.value})]),
      el("div",{class:"field"},[el("label",{},"เหตุผลการออก"), el("input",{oninput:(e)=>reason=e.target.value})]),
    ]),
    el("div",{class:"modal-foot"},[
      el("button",{class:"btn", onclick:closeModal}, "ยกเลิก"),
      el("button",{class:"btn btn-danger", onclick: async ()=>{
        await saveEmployee(id, {
          status: "offboarding",
          offboarding: { started:true, items: makeItemsFromTemplate(getOffTemplate()), lastWorkDate, reason, exitSummary:"" }
        });
        state.activeTab = "offboarding";
        closeModal();
        render();
      }}, "เริ่ม Offboarding")
    ])
  ]);
  openModal(body);
}

/* ============== SETTINGS MODAL (Apps Script API URL) ============== */
function openSettingsModal(){
  let urlVal = getApiUrl();
  const body = el("div",{},[
    el("h2",{},"ตั้งค่าการเชื่อมต่อฐานข้อมูล"),
    el("div",{class:"sub"},"วาง URL ของ Google Apps Script Web App ที่ deploy แล้ว (ดูวิธีทำใน README.md ของ repo) ข้อมูลจะถูกเก็บใน Google Sheet ของคุณเอง"),
    el("div",{class:"field"},[
      el("label",{},"Apps Script Web App URL"),
      el("input",{value:urlVal, placeholder:"https://script.google.com/macros/s/XXXXXXXX/exec", oninput:(e)=>urlVal=e.target.value})
    ]),
    el("div",{class:"modal-foot"},[
      el("button",{class:"btn", onclick:closeModal}, "ปิด"),
      el("button",{class:"btn btn-primary", onclick:()=>{
        setApiUrl(urlVal);
        closeModal();
        toast("บันทึก URL แล้ว กำลังเชื่อมต่อ...");
        startPolling();
      }}, "บันทึกและเชื่อมต่อ")
    ])
  ]);
  openModal(body);
}

/* ============== BOOT ============== */
(function boot(){
  const session = loadSession();
  if(session && session.role){
    state.authed = true;
    state.role = session.role;
    state.selectedId = session.selectedId || null;
  }
  render();
  startPolling();
})();

// Register the service worker so the app is installable (Add to Home
// Screen / "Install app") and still opens if the connection drops.
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{ /* offline/first load — not fatal */ });
  });
}
